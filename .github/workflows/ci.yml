name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      options: --user pwuser
      # Match Playwright 1.64.0; the digest pins preinstalled engines and OS dependencies.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Validate browser runtime
        run: |
          node --input-type=module <<'JS'
          import { chromium, firefox, webkit } from "playwright";
          for (const engine of [chromium, firefox, webkit]) {
            const browser = await engine.launch();
            await browser.close();
          }
          JS
      - name: Scan full Git history
        run: pnpm secrets
      - name: Lint, format, dependency, and unit checks
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Test source, built browser output, and independent package
        run: pnpm --filter @design-home/compare test
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: |
            .legacy-review/navigation/
            design-compare/.legacy-review/navigation/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Prepare package output
        run: mkdir -p /tmp/design-home-package
      - name: Pack npm package
        run: pnpm --filter @design-home/compare pack --pack-destination /tmp/design-home-package
