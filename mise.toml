[tools]
node = "24.21.0"
pnpm = "12.18.0"
gitleaks = "8.30.1"

[tasks.setup]
run = "pnpm run setup"

[tasks.dev]
run = "pnpm dev"

[tasks.hub]
run = "pnpm hub"

[tasks.check]
run = "pnpm check"

[tasks.test]
run = "pnpm test"

[tasks.build]
run = "pnpm build"

[tasks."test:build"]
run = "pnpm test:build"

[tasks.secrets]
run = "pnpm secrets"
